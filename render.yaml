services:
  - type: web
    name: devflow-api-mhmdhalim
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >-
      /bin/sh -c '/app/.venv/bin/alembic upgrade head &&
      exec /app/.venv/bin/uvicorn app.main:app
      --host 0.0.0.0 --port ${PORT:-10000}'
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: '["https://devflow-mhmdhalim.onrender.com"]'
      - key: DATABASE_URL
        fromDatabase:
          name: devflow-db-mhmdhalim
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: devflow-mhmdhalim
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE
        value: https://devflow-api-mhmdhalim.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: devflow-db-mhmdhalim
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: devflow
    user: devflow
