services:
  - type: web
    name: devflow-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >-
      /bin/sh -c '/app/.venv/bin/alembic upgrade head &&
      exec /app/.venv/bin/uvicorn app.main:app
      --host 0.0.0.0 --port ${PORT:-10000}'
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: devflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: devflow-web
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        fromService:
          name: devflow-api
          type: web
          property: hostport

databases:
  - name: devflow-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: devflow
    user: devflow
