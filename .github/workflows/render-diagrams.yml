name: Render Draw.io diagrams

on:
  push:
    branches:
      - docs/1-render-diagrams
    paths:
      - "**/*.drawio"
      - ".github/workflows/render-diagrams.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export Draw.io files to PNG
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: docs
          format: png
          output: rendered
          remove-page-suffix: true
          border: 20
          width: 2400
          action-mode: all

      - name: Move renders to numbered documentation paths
        shell: bash
        run: |
          set -euo pipefail

          mv docs/architecture/diagrams/rendered/system-architecture.png \
             docs/architecture/diagrams/01-system-architecture.png

          mv docs/architecture/diagrams/rendered/api-database-flow.png \
             docs/architecture/diagrams/02-api-database-flow.png

          mv docs/database/rendered/database-erd.png \
             docs/database/03-database-erd.png

          mv docs/planning/rendered/engineering-workflow.png \
             docs/planning/04-engineering-workflow.png

          find docs -type d -name rendered -empty -delete

      - name: Commit rendered PNGs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            docs/architecture/diagrams/01-system-architecture.png \
            docs/architecture/diagrams/02-api-database-flow.png \
            docs/database/03-database-erd.png \
            docs/planning/04-engineering-workflow.png

          if git diff --cached --quiet; then
            echo "No diagram changes to commit."
            exit 0
          fi

          git commit -m "docs(diagrams): render numbered PNG previews"
          git push
