name: E2E CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e-ci.yml"

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e-ci.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: devflow
          POSTGRES_PASSWORD: test
          POSTGRES_DB: devflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devflow -d devflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://devflow:test@localhost:5432/devflow
      SECRET_KEY: test-secret-key-for-ci-only-at-least-32-chars
      E2E_BASE_URL: http://127.0.0.1:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --dev

      - name: Run database migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Start backend
        run: |
          cd backend
          nohup uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/devflow-api.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/devflow-api.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        run: nohup npm run dev --prefix frontend -- --host 127.0.0.1 > /tmp/devflow-frontend.log 2>&1 &

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/devflow-frontend.log
          exit 1

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm install

      - name: Install Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: tests/e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
