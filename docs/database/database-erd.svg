<text x="74.0" y="170.8" text-anchor="start" font-size="16" font-weight="700" fill="#111827">#Auth / Users</text>
<rect x="610" y="140" width="480" height="50" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="624.0" y="170.8" text-anchor="start" font-size="16" font-weight="700" fill="#111827">#Organizations</text>
<rect x="1160" y="140" width="480" height="50" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="1174.0" y="170.8" text-anchor="start" font-size="16" font-weight="700" fill="#111827">#Projects</text>
<rect x="1710" y="140" width="600" height="50" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="1724.0" y="170.8" text-anchor="start" font-size="16" font-weight="700" fill="#111827">#Issues / Collaboration</text>
<rect x="120" y="240" width="360" height="190" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="134.0" y="339.3" text-anchor="start" font-size="12" font-weight="700" fill="#14532d">#Table #Auth&amp;#10;users&amp;#10;PK id&amp;#10;email UNIQUE&amp;#10;password_hash&amp;#10;display_name&amp;#10;status&amp;#10;created_at&amp;#10;updated_at</text>
<rect x="120" y="540" width="360" height="170" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="134.0" y="629.3" text-anchor="start" font-size="12" font-weight="700" fill="#14532d">#Table #Auth&amp;#10;refresh_tokens&amp;#10;PK id&amp;#10;FK user_id → users.id&amp;#10;token_hash UNIQUE&amp;#10;expires_at&amp;#10;revoked_at&amp;#10;created_at</text>
<rect x="670" y="240" width="360" height="170" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="684.0" y="329.3" text-anchor="start" font-size="12" font-weight="700" fill="#1e3a8a">#Table #Organization&amp;#10;organizations&amp;#10;PK id&amp;#10;FK owner_id → users.id&amp;#10;name&amp;#10;slug UNIQUE&amp;#10;created_at</text>
<rect x="670" y="540" width="360" height="190" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="684.0" y="639.3" text-anchor="start" font-size="12" font-weight="700" fill="#1e3a8a">#Table #Membership&amp;#10;organization_members&amp;#10;PK id&amp;#10;FK organization_id → organizations.id&amp;#10;FK user_id → users.id&amp;#10;role&amp;#10;joined_at&amp;#10;UNIQUE(org,user)</text>
<rect x="1220" y="240" width="360" height="190" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="1234.0" y="339.3" text-anchor="start" font-size="12" font-weight="700" fill="#2e1065">#Table #Project&amp;#10;projects&amp;#10;PK id&amp;#10;FK organization_id → organizations.id&amp;#10;name&amp;#10;key UNIQUE per org&amp;#10;description&amp;#10;status&amp;#10;created_at</text>
<rect x="1220" y="540" width="360" height="170" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="1234.0" y="629.3" text-anchor="start" font-size="12" font-weight="700" fill="#2e1065">#Table #Membership&amp;#10;project_members&amp;#10;PK id&amp;#10;FK project_id → projects.id&amp;#10;FK user_id → users.id&amp;#10;role&amp;#10;UNIQUE(project,user)</text>
<rect x="1220" y="830" width="360" height="160" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="1234.0" y="914.3" text-anchor="start" font-size="12" font-weight="700" fill="#2e1065">#Table #Project&amp;#10;labels&amp;#10;PK id&amp;#10;FK project_id → projects.id&amp;#10;name&amp;#10;color&amp;#10;UNIQUE(project,name)</text>
<rect x="1780" y="230" width="420" height="240" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="1794.0" y="354.3" text-anchor="start" font-size="12" font-weight="700" fill="#7f1d1d">#Table #Issue&amp;#10;issues&amp;#10;PK id&amp;#10;FK project_id → projects.id&amp;#10;FK reporter_id → users.id&amp;#10;title&amp;#10;description&amp;#10;type&amp;#10;status&amp;#10;priority&amp;#10;created_at&amp;#10;updated_at</text>
<rect x="1780" y="550" width="420" height="140" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="1794.0" y="624.3" text-anchor="start" font-size="12" font-weight="700" fill="#7f1d1d">#Table #Issue&amp;#10;issue_assignees&amp;#10;FK issue_id → issues.id&amp;#10;FK user_id → users.id&amp;#10;PK(issue_id,user_id)</text>
<rect x="1780" y="770" width="420" height="140" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="1794.0" y="844.3" text-anchor="start" font-size="12" font-weight="700" fill="#7f1d1d">#Table #Issue&amp;#10;issue_labels&amp;#10;FK issue_id → issues.id&amp;#10;FK label_id → labels.id&amp;#10;PK(issue_id,label_id)</text>
<rect x="1780" y="1000" width="420" height="170" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="1794.0" y="1089.3" text-anchor="start" font-size="12" font-weight="700" fill="#78350f">#Table #Collaboration&amp;#10;comments&amp;#10;PK id&amp;#10;FK issue_id → issues.id&amp;#10;FK author_id → users.id&amp;#10;body&amp;#10;created_at&amp;#10;updated_at</text>
<rect x="1780" y="1250" width="420" height="190" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="1794.0" y="1349.3" text-anchor="start" font-size="12" font-weight="700" fill="#111827">#Table #Storage&amp;#10;attachments&amp;#10;PK id&amp;#10;FK issue_id → issues.id&amp;#10;FK uploaded_by → users.id&amp;#10;storage_key&amp;#10;filename&amp;#10;content_type&amp;#10;size_bytes</text>
<rect x="1220" y="1100" width="360" height="170" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<text x="1234.0" y="1189.3" text-anchor="start" font-size="12" font-weight="700" fill="#831843">#Table #Notification&amp;#10;notifications&amp;#10;PK id&amp;#10;FK user_id → users.id&amp;#10;type&amp;#10;payload JSONB&amp;#10;read_at&amp;#10;created_at</text>
<rect x="670" y="1100" width="360" height="190" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
<text x="684.0" y="1199.3" text-anchor="start" font-size="12" font-weight="700" fill="#111827">#Table #Audit&amp;#10;audit_logs&amp;#10;PK id&amp;#10;FK actor_id → users.id&amp;#10;entity_type&amp;#10;entity_id&amp;#10;action&amp;#10;metadata JSONB&amp;#10;created_at</text>
<rect x="70" y="950" width="470" height="300" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="84.0" y="1104.3" text-anchor="start" font-size="12" font-weight="700" fill="#111827">COLOR / HASHTAG LEGEND&amp;#10;🟩 #Auth = identity + tokens&amp;#10;🔵 #Organization = organizations + membership&amp;#10;🟣 #Project = project-scoped data&amp;#10;🟥 #Issue = core work items&amp;#10;🟨 #Collaboration = comments&amp;#10;🩷 #Notification = user notifications&amp;#10;⚪ #Audit / #Storage = operational data&amp;#10;&amp;#10;PK = Primary Key   FK = Foreign Key</text>
</svg>